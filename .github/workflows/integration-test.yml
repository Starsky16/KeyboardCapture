name: Integration Test

# 集成冒烟测试：用官方 Release 版 ClassIsland 启动并加载本插件，
# 验证插件入口 Initialize 完整执行（含托管服务注册）且无异常。
# 运行时按键捕捉在无头 CI 环境中无法模拟真实按键，由本地 tools/run-local-test.ps1 覆盖。

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: windows-latest
    name: Launch in ClassIsland
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Publish plugin
        shell: pwsh
        run: dotnet publish KeyboardCapture.csproj -c Release -o "$env:RUNNER_TEMP\plugin"

      - name: Download & extract ClassIsland (official release 2.1.0.1)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "classisland.zip"
          $dest = Join-Path $env:RUNNER_TEMP "classisland"
          Invoke-WebRequest -Uri "https://github.com/ClassIsland/ClassIsland/releases/download/2.1.0.1/ClassIsland_app_windows_x64_full_folder.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $exe = Get-ChildItem -Path $dest -Recurse -Filter "ClassIsland.Desktop.exe" | Select-Object -First 1
          if (-not $exe) { throw "未在解压目录中找到 ClassIsland.Desktop.exe" }
          Write-Host "ClassIsland.Desktop.exe: $($exe.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Value "CI_CLASSISLAND_EXE=$($exe.FullName)"

      - name: Launch ClassIsland with plugin & verify load marker
        shell: pwsh
        env:
          KEYBOARD_CAPTURE_CI_MARKER: "1"
        run: |
          $exe = $env:CI_CLASSISLAND_EXE
          $exeDir = Split-Path $exe
          # folder 打包：插件配置目录 = AppRoot/data/Config/Plugins/<manifest.id>
          $appRoot = (Resolve-Path (Join-Path $exeDir "..")).Path
          $marker = Join-Path $appRoot "data\Config\Plugins\Starsky16.KeyboardCapture\loaded.marker"
          $pluginDir = Join-Path $env:RUNNER_TEMP "plugin"

          $proc = Start-Process -FilePath $exe -ArgumentList @("-epp", $pluginDir, "--skip-oobe", "--quiet") -PassThru -WindowStyle Hidden
          try {
            $deadline = (Get-Date).AddSeconds(150)
            $found = $false
            while ((Get-Date) -lt $deadline) {
              if (Test-Path $marker) { $found = $true; break }
              if ($proc.HasExited) {
                Write-Host "ClassIsland 进程已退出, ExitCode=$($proc.ExitCode)"
                break
              }
              Start-Sleep -Seconds 5
            }
            if (-not $found) { throw "插件未能在 ClassIsland 中成功加载（标记文件不存在: $marker）" }
            Write-Host "✅ 插件加载成功，标记文件: $marker"
            Get-Content $marker
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
